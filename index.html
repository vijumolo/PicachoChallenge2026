    --text-primary: #2D2D3F;

    position: relative;
    overflow: hidden;
  }
  .header-content {

    gap: 1.2rem;
    position: relative;
    z-index: 1;
  }
  .header-logo {

    height: auto;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
    flex-shrink: 0;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
    animation: shimmer 8s ease-in-out infinite;
  }
  @keyframes shimmer { 0%,100% { transform: translateX(-20%); } 50% { transform: translateX(20%); } }

  .header h1 {

    font-weight: 800;
    color: var(--text-primary);
    position: relative;
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
  }
  .header .subtitle {

    color: var(--text-secondary);
    margin-top: 0.3rem;
    position: relative;
  }
  .header .event-badge {
    display: inline-block;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    padding: 0.3rem 1rem;
    border-radius: 20px;
    margin-top: 0.8rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem;
  }

  .tabs {

    gap: 0.5rem;
    margin: 1rem 0;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1;
    min-width: 140px;
    padding: 0.8rem 1rem;
    border: none;
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    background: var(--bg-card);
    color: var(--text-secondary);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-purple));
    color: var(--text-primary);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(216,181,255,0.3);
  }
  .tab:hover:not(.active) { background: var(--pastel-mint); }

  .filters {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow);
  }
  .filters-row {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-group {
    flex: 1;
    min-width: 200px;
  }
  .filter-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.3rem;
  }
  .filter-group select,
  .filter-group input {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border: 2px solid var(--border-light);
    border-radius: 8px;
    font-size: 0.9rem;
    background: var(--bg-main);
    color: var(--text-primary);
    transition: border-color 0.3s;
    outline: none;
  }
  .filter-group select:focus,
  .filter-group input:focus {
    border-color: var(--pastel-purple);
  }

  .stats-bar {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--bg-card);
    padding: 0.4rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  .stat-chip.total { background: var(--pastel-blue); }
  .stat-chip.shown { background: var(--pastel-green); }
  .stat-chip.male { background: var(--pastel-mint); }
  .stat-chip.female { background: var(--pastel-pink); }

  .results-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  thead th {
    background: linear-gradient(135deg, var(--pastel-lavender), var(--pastel-blue));
    padding: 0.7rem 0.6rem;
    text-align: left;
    font-weight: 700;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    position: sticky;
    top: 0;
    z-index: 10;
    white-space: nowrap;
  }
  tbody tr {
    transition: background 0.2s;
    cursor: pointer;
  }
  tbody tr:hover { background: var(--pastel-mint); }
  tbody tr:nth-child(even) { background: rgba(181,216,255,0.08); }
  tbody tr:nth-child(even):hover { background: var(--pastel-mint); }
  tbody td {
    padding: 0.55rem 0.6rem;
    border-bottom: 1px solid var(--border-light);
    white-space: nowrap;
  }
  .puesto {
    font-weight: 800;
    width: 2rem;
    text-align: center;
  }
  .puesto-1 { color: #FFD700; }
  .puesto-2 { color: #C0C0C0; }

  .nombre-cell { font-weight: 600; max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
  .tiempo-cell { font-family: 'Courier New', monospace; font-weight: 600; color: var(--text-primary); }

  .ciudad-cell { color: var(--text-secondary); }

    gap: 0.5rem;
    padding: 1rem;
    flex-wrap: wrap;

  .page-btn {

    background: var(--bg-card);

    font-size: 0.85rem;
    font-weight: 600;

    border-color: var(--pastel-purple);
    color: white;

    padding: 3rem 1rem;
    color: var(--text-secondary);

    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 1rem;

  .modal {

    border-radius: var(--radius);

    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);

    top: 0.8rem;
    right: 0.8rem;
    background: var(--pastel-pink);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: transform 0.2s;
  }

  .modal-header {
    background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-purple), var(--pastel-blue));

    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .modal-body { padding: 1.5rem; }

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.8rem;
    margin-bottom: 1.2rem;
  }
  .info-item {
    background: var(--bg-main);
    padding: 0.8rem;
    border-radius: 8px;
    text-align: center;
  }

    text-transform: uppercase;
    color: var(--text-secondary);
    font-weight: 600;
    letter-spacing: 0.5px;

  .info-item .value {
    font-size: 1.1rem;
    font-weight: 700;
    margin-top: 0.2rem;
  }
  .info-item.highlight {

  .diploma-section {

    padding-top: 1rem;
    border-top: 2px dashed var(--border-light);

    color: var(--text-secondary);
    margin-bottom: 0.8rem;

    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;

  .diploma-actions {

    justify-content: center;
    flex-wrap: wrap;
    margin-top: 0.5rem;

    align-items: center;

    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;

    color: var(--text-primary);

    margin: 0 auto;

    height: 24px;
    border: 3px solid var(--pastel-purple);

    border-radius: 50%;

    margin-right: 0.5rem;

    font-weight: 700;
    color: var(--pastel-purple);
  }
  .pair-members {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;

  .pair-member {
    background: var(--bg-main);
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    font-size: 0.8rem;

    .tabs { gap: 0.3rem; }
    .tab { padding: 0.6rem 0.5rem; font-size: 0.8rem; min-width: 100px; }
    .filters { padding: 0.7rem; }
    .filters-row { gap: 0.5rem; }
    table { font-size: 0.75rem; }
    thead th { padding: 0.5rem 0.4rem; font-size: 0.7rem; }
    tbody td { padding: 0.4rem; }
    .athlete-info { grid-template-columns: repeat(2, 1fr); }
    .modal { margin: 0.5rem; }
  }

</head>

  </div>
</div>

function switchMode(mode) {
  currentMode = mode;
  currentPage = 1;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  populateCategories();
  applyFilters();
}

function populateCategories() {
  const select = document.getElementById('categoryFilter');
  select.innerHTML = '<option value="all">Todas las categorías</option>';
  
  if (currentMode === 'parejas') {
    document.getElementById('genderFilter').style.display = 'none';
    return;
  }
  
  document.getElementById('genderFilter').style.display = '';
  
  let cats = [];
  if (currentMode === 'fondo') {
    cats = DATA.fondoCompleto.categorias;
  } else {
    cats = DATA.medioFondo.categorias;
  }
  
  cats.forEach(c => {
    const label = c.gender ? `${c.name} (${c.gender})` : c.name;
    const opt = document.createElement('option');
    opt.value = c.name;
    opt.textContent = label;
    select.appendChild(opt);
  });
}

function getAllParticipants() {
  if (currentMode === 'parejas') return [];
  
  let cats = currentMode === 'fondo' ? DATA.fondoCompleto.categorias : DATA.medioFondo.categorias;
  let result = [];
  
  const selectedCat = document.getElementById('categoryFilter').value;
  const selectedGender = document.getElementById('genderFilter').value;
  
  cats.forEach(c => {
    if (selectedCat !== 'all' && c.name !== selectedCat) return;
    if (selectedGender !== 'all' && c.gender !== selectedGender && c.gender !== '') return;
    
    c.participants.forEach(p => {
      result.push({ ...p, category: c.name, gender: c.gender });
    });
  });
  
  return result;
}

function applyFilters() {
  currentPage = 1;
  
  if (currentMode === 'parejas') {
    renderPairs();
    return;
  }
  
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const placaSearch = document.getElementById('placaInput').value.toLowerCase().trim();
  let participants = getAllParticipants();
  
  if (search) {
    participants = participants.filter(p =>
      p.nombre.toLowerCase().includes(search) ||
      p.ciudad.toLowerCase().includes(search)
    );
  }
  
  if (placaSearch) {
    participants = participants.filter(p =>
      p.placa.toString().toLowerCase().includes(placaSearch)
    );
  }
  
  document.getElementById('statTotal').textContent = `Total: ${getAllParticipants().length}`;
  document.getElementById('statShown').textContent = `Mostrando: ${participants.length}`;
  
  renderTable(participants);
}

function renderTable(participants) {
  const container = document.getElementById('resultsContainer');
  container.innerHTML = '';
  
  if (participants.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">No hay datos</div><p>No se encontraron resultados</p></div>';
    return;
  }
  
  const totalPages = Math.ceil(participants.length / PER_PAGE);
  const start = (currentPage - 1) * PER_PAGE;
  const pageData = participants.slice(start, start + PER_PAGE);
  
  let html = '<div class="results-card"><div class="table-wrapper"><table>';
  html += '<thead><tr><th>Puesto</th><th>Placa</th><th>Nombre</th><th>Ciudad</th><th>Categoría</th><th>Tiempo</th><th>Dif.</th></tr></thead><tbody>';
  
  pageData.forEach(p => {
    const puestoClass = ['1','2','3'].includes(p.puesto) ? ` puesto-${p.puesto}` : '';
    html += `<tr onclick='showAthlete(${JSON.stringify(p).replace(/'/g,"&#39;")})'>`;
    html += `<td class="puesto${puestoClass}">${p.puesto}</td>`;
    html += `<td>${p.placa}</td>`;
    html += `<td class="nombre-cell">${p.nombre}</td>`;
    html += `<td class="ciudad-cell">${p.ciudad}</td>`;
    html += `<td><small>${p.category}${p.gender ? ' (' + p.gender + ')' : ''}</small></td>`;
    html += `<td class="tiempo-cell">${p.tiempo}</td>`;
    html += `<td class="dif-cell">${p.dif}</td>`;
    html += '</tr>';
  });
  
  html += '</tbody></table></div>';
  
  if (totalPages > 1) {
    html += '<div class="pagination">';
    html += `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>&laquo;</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (totalPages > 7 && Math.abs(i - currentPage) > 2 && i !== 1 && i !== totalPages) {
        if (i === currentPage - 3 || i === currentPage + 3) html += '<span>...</span>';
        continue;
      }
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>&raquo;</button>`;
    html += '</div>';
  }
  
  container.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  if (currentMode === 'parejas') {
    renderPairs();
  } else {
    renderTableFromFilters();
  }
  window.scrollTo({ top: 300, behavior: 'smooth' });
}

function renderTableFromFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const placaSearch = document.getElementById('placaInput').value.toLowerCase().trim();
  let participants = getAllParticipants();
  
  if (search) {
    participants = participants.filter(p =>
      p.nombre.toLowerCase().includes(search) ||
      p.ciudad.toLowerCase().includes(search)
    );
  }
  
  if (placaSearch) {
    participants = participants.filter(p =>
      p.placa.toString().toLowerCase().includes(placaSearch)
    );
  }
  
  document.getElementById('statTotal').textContent = `Total: ${getAllParticipants().length}`;
  document.getElementById('statShown').textContent = `Mostrando: ${participants.length}`;
  
  renderTable(participants);
}

function renderPairs() {
  const container = document.getElementById('pairsContainer');
  const resultsContainer = document.getElementById('resultsContainer');
  resultsContainer.innerHTML = '';
  
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const placaSearch = document.getElementById('placaInput').value.toLowerCase().trim();
  let pairs = DATA.parejas || [];
  
  if (search) {
    pairs = pairs.filter(p =>
      p.name.toLowerCase().includes(search) ||
      p.members.some(m => m.nombre.toLowerCase().includes(search) || m.ciudad.toLowerCase().includes(search))
    );
  }
  
  if (placaSearch) {
    pairs = pairs.filter(p =>
      p.members.some(m => m.chip.toString().toLowerCase().includes(placaSearch))
    );
  }
  
  document.getElementById('statTotal').textContent = `Total parejas: ${DATA.parejas.length}`;
  document.getElementById('statShown').textContent = `Mostrando: ${pairs.length}`;
  
  if (pairs.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">No hay datos</div><p>No se encontraron parejas</p></div>';
    return;
  }
  
  let html = '';
  pairs.forEach((pair, idx) => {
    const time = pair.members[0]?.tiempo || '';
    html += `<div class="pair-card" onclick='showPair(${JSON.stringify(pair).replace(/'/g,"&#39;")})'>`;
    html += `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">`;
    html += `<div><span style="color:var(--text-secondary);font-size:0.8rem">#${idx+1}</span> <span class="pair-name">${pair.name}</span></div>`;
    html += `<span class="pair-time">${time}</span>`;
    html += `</div>`;
    html += `<div class="pair-members">`;
    pair.members.forEach(m => {
      html += `<span class="pair-member">${m.nombre} (${m.ciudad}) - ${m.tiempo}</span>`;
    });
    html += `</div></div>`;
  });
  
  container.innerHTML = html;
}

async function showDiploma() {
  const frame = document.getElementById('diplomaFrame');
  frame.style.display = 'block';
  frame.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-secondary)"><p>Cargando diploma...</p></div>';

  let diplomaPath = '';
  if (currentMode === 'parejas' || currentCategoryName === 'Parejas') {
    diplomaPath = 'Fondo Completo/Diplomas Parejas/DIPLOMAS PAREJAS.pdf';
  } else if (currentMode === 'medio') {
    diplomaPath = 'Medio Fondo/Diplomas Medio Challenge/DIPLOMA CHALLENGE MEDIO.pdf';
  } else {
    diplomaPath = 'Fondo Completo/Diplomas Challenge Completo/DIPLOMAS CHALLENGE COMPLETO.pdf';
  }

  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    if (!window._diplomaIndex || window._diplomaIndex.key !== diplomaPath) {
      const loadingTask = pdfjsLib.getDocument(diplomaPath);
      const pdf = await loadingTask.promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        const rawStrs = tc.items.map(item => item.str);
        const joinedSpace = rawStrs.join(' ');
        const normUp = joinedSpace.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
        const nameItem = (rawStrs[2] || '').trim();
        const normName = nameItem.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
        pages.push({ num: i, rawStrs, joinedSpace, normUp, nameItem, normName });
      }
      window._diplomaIndex = { key: diplomaPath, pdf, pages };
    }

    const { pdf, pages } = window._diplomaIndex;
    const athleteName = currentAthlete ? currentAthlete.nombre.toUpperCase() : '';

    let foundPage = -1;

    if (currentMode === 'parejas' || currentCategoryName === 'Parejas') {
      const nPair = athleteName.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^A-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
      const pairParts = nPair.split(/\s+/).filter(p => p.length > 1 && p !== 'Y');

      for (const entry of pages) {
        if (pairParts.every(p => entry.normUp.includes(p))) {
          foundPage = entry.num;
          break;
        }
      }
    } else {
      const nName = athleteName.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^A-Z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

      let firstName = '', lastName = '';
      if (nName.includes(',')) {
        const cparts = nName.split(',').map(p => p.trim()).filter(p => p);
        lastName = cparts[0] || '';
        firstName = cparts.slice(1).join(' ') || '';
      } else {
        firstName = nName;
      }

      const fullNameFL = (firstName + ' ' + lastName).trim();
      const regexFL = fullNameFL ? new RegExp(fullNameFL.replace(/\s+/g, '\\s+'), 'i') : null;
      const regexLF = nName ? new RegExp(nName.replace(/\s+/g, '\\s+'), 'i') : null;

      const allParts = (firstName + ' ' + lastName).split(/\s+/).filter(p => p.length > 1);

      for (const entry of pages) {
        if ((regexFL && regexFL.test(entry.normUp)) || (regexLF && regexLF.test(entry.normUp))) {
          foundPage = entry.num;
          break;
        }
        if (allParts.length >= 2 && allParts.every(p => entry.normUp.includes(p))) {
          foundPage = entry.num;
          break;
        }
      }

      if (foundPage === -1 && allParts.length >= 1) {
        let bestScore = 0;
        for (const entry of pages) {
          const score = allParts.filter(p => entry.normUp.includes(p)).length;
          if (score > bestScore && score >= Math.ceil(allParts.length * 0.7)) {
            bestScore = score;
            foundPage = entry.num;
          }
        }
      }
    }

    if (foundPage === -1) {
      frame.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-secondary)"><p style="font-size:1.1rem;margin-bottom:0.5rem">Diploma no encontrado</p><p style="font-size:0.85rem">El nombre no coincide con ninguno en el archivo de diplomas.<br>Esto puede deberse a diferencias en la escritura del nombre.</p></div>';
      return;
    }

    const page = await pdf.getPage(foundPage);
    const viewport = page.getViewport({ scale: 1.5 });

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    canvas.style.borderRadius = '8px';
    canvas.style.boxShadow = '0 4px 20px rgba(0,0,0,0.15)';

    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;

    frame.innerHTML = '';
    frame.appendChild(canvas);

    const actions = document.createElement('div');
    actions.className = 'diploma-actions';

    const diplomaName = pages[foundPage - 1]?.nameItem || '';

    const matchBtn = document.createElement('div');
    matchBtn.style.cssText = 'font-size:0.85rem;color:var(--text-secondary)';
    matchBtn.innerHTML = '<span style="color:var(--pastel-green)">&#9679;</span> ' + diplomaName;
    actions.appendChild(matchBtn);

    const downloadBtn = document.createElement('button');
    downloadBtn.className = 'diploma-download';
    downloadBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Descargar Diploma';
    downloadBtn.onclick = function() {
      const link = document.createElement('a');
      const nameClean = currentAthlete ? currentAthlete.nombre.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ]/g, '_').substring(0, 40) : 'diploma';
      link.download = 'Diploma_' + nameClean + '.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    };
    actions.appendChild(downloadBtn);

    const printBtn = document.createElement('button');
    printBtn.className = 'diploma-download';
    printBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Imprimir';
    printBtn.onclick = function() {
      const dataUrl = canvas.toDataURL('image/png', 1.0);
      const printWindow = window.open('', '_blank');
      printWindow.document.write('<html><head><title>Diploma - ' + (currentAthlete?.nombre || '') + '</title><style>@page{size:landscape;margin:0}body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}img{max-width:100%;max-height:100vh}</style></head><body><img src="' + dataUrl + '" onload="window.print();window.close()"/></body></html>');
      printWindow.document.close();
    };
    actions.appendChild(printBtn);

    const info = document.createElement('div');
    const isExact = window._diplomaExactMatch;
    frame.appendChild(actions);

  } catch (err) {
    frame.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--text-secondary)">
      <p style="margin-bottom:0.5rem"><strong>Error al cargar el diploma</strong></p>
      <p style="font-size:0.8rem">${err.message}</p>
      <p style="font-size:0.75rem;margin-top:0.5rem">Asegúrese de estar ejecutando el servidor local (node server.js)</p>
    </div>`;
  }
}

  if (e && e.target !== document.getElementById('athleteModal')) return;
  document.getElementById('athleteModal').classList.remove('active');
  document.body.style.overflow = '';
